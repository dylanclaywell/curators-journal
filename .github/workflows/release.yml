name: Release

on:
  push:
    branches: [main]
  # Manual re-run, so a failed deploy doesn't need another release to retry.
  # Prefer dispatching against the release **tag** rather than `main`: the
  # dropdown accepts either, and a tag keeps the deployed `__APP_VERSION__`
  # matching the code, which is the whole reason deploys are release-gated.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Conventional-commit driven versioning. Opens/updates a release PR; merging
  # it tags a release and flips release_created, which gates the deploy below.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Production deploys happen on release, not on every push to main.
  #
  # That isn't ceremony: the About panel reports __APP_VERSION__, injected from
  # package.json, and release-please only bumps that file in the release PR. If
  # we deployed every push, the running app would advertise a version that
  # doesn't match its code — and that readout is what we use to measure the
  # window on a real device, so it has to be trustworthy.
  # A manual dispatch bypasses the release gate deliberately — that is what
  # makes a failed deploy retryable. release-please still runs first on a
  # dispatch, where it simply re-syncs its release PR and reports no release.
  deploy:
    needs: release-please
    if: >-
      ${{ needs.release-please.outputs.release_created == 'true'
      || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node comes from .nvmrc so CI and local dev cannot drift apart. 22 is a
      # floor wrangler sets, not a preference: wrangler 4.130 and miniflare 5
      # both declare engines >=22.0.0, and that arrived inside the existing ^4
      # range — so an older pin here breaks the deploy with nothing in the repo
      # having changed. That is exactly how it broke.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Its own step, so the skill-icon fetch, vue-tsc and vite build fail
      # visibly and separately from the deploy itself. It also writes
      # .wrangler/deploy/config.json, which points wrangler at the generated
      # dist/curators_journal/wrangler.json.
      - name: Build
        run: npm run build

      # Deliberately not cloudflare/wrangler-action: it installs its own pinned
      # wrangler (3.90.0), which collides with the 4.x this project and
      # @cloudflare/vite-plugin require — an ERESOLVE failure. Calling the
      # project's own wrangler is both simpler and the version that was
      # actually tested. Auth comes from the environment.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
