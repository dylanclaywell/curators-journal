name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node comes from .nvmrc so CI and local dev cannot drift apart. 22 is a
      # floor wrangler sets, not a preference: wrangler 4.130 and miniflare 5
      # both declare engines >=22.0.0, and that arrived inside the existing ^4
      # range — so an older pin here breaks the deploy with nothing in the repo
      # having changed. That is exactly how it broke.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Both projects must type-check: the app (vue-tsc) and the Worker
      # (tsconfig.worker.json, workers-types).
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      # Runs in workerd via @cloudflare/vitest-pool-workers, against a local
      # SQLite — no Cloudflare account, no network, no secrets needed here.
      - name: Test
        run: npm run test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
